services:
  zen-llm-engine:
    # build: . # If you want to build from source, uncomment this and comment out the image line
    image: xargonwan/zen-llm-engine:latest
    # For backward compatibility, the old name is also published:
    # image: xargonwan/selenium-llm-engine:latest
    container_name: zen-llm-engine
    ports:
      - "14848:8000"  # API port
      - "3001:3001"   # webtop interface
    # environment:
    #   - ZEN_DEBUG=true  # trace prompts/chunks/replies (default: off)
    #   - SELENIUM_DEBUG=true  # legacy alias, also works
    volumes:
      - data:/app/data
      - config:/config
    # Docker's json-file driver is unbounded by default.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
volumes:
  data:
  config:
